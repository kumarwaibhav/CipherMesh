<text class="sans" x="1234" y="597" fill="#6b6b6b"><tspan>R1–R5 (</tspan><tspan font-weight="700" fill="#dc2626">BLOCK</tspan><tspan> &gt; </tspan><tspan font-weight="700" fill="#0284c7">REVIEW</tspan><tspan> &gt; </tspan><tspan font-weight="700" fill="#d97706">REDACT</tspan><tspan> &gt; </tspan><tspan font-weight="700" fill="#16a34a">ALLOW</tspan><tspan>)</tspan></text>
