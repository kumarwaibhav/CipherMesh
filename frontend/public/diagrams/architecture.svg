<rect x="0" y="0" width="1972" height="976" fill="#ffffff"/>
<text class="sans" x="40" y="52" font-size="22" font-weight="700">CipherMesh — System Architecture</text>
<text class="sans" x="40" y="78" font-size="14" fill="#6b6b6b">Every prompt is inspected, sealed and routed inside the trust boundary; only ALLOW or REDACT-sanitised text ever reaches a provider.</text>
<text class="sans" x="40" y="128" font-weight="700" fill="#6b6b6b" letter-spacing="1">1 · CLIENTS</text>
<text class="sans" x="352" y="128" font-weight="700" fill="#6b6b6b" letter-spacing="1">2 · API GATEWAY</text>
<text class="sans" x="816" y="128" font-weight="700" fill="#6b6b6b" letter-spacing="1">3 · AGENT CORE</text>
<text class="sans" x="1684" y="128" font-weight="700" fill="#6b6b6b" letter-spacing="1">4 · LLM PROVIDERS</text>
<!-- Tier 3 - LangGraph orchestrator -->
<g class="box">
