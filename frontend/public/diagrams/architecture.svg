<text class="sans" x="856" y="588" fill="#6b6b6b">25 rules · Luhn/Verhoeff checksums ·</text>
<text class="sans" x="856" y="606" fill="#6b6b6b">de-obfuscation</text>
</g>
<g class="box">
<rect x="1218" y="540" width="354" height="84" rx="10" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/>
