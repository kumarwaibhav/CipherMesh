<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1972" height="976" viewBox="0 0 1972 976" font-size="13" fill="#141414">
<title>CipherMesh — System Architecture</title>
<desc>Four-tier left-to-right architecture: clients, FastAPI gateway, LangGraph agent core with CipherMesh engine, and LLM providers beyond the organisational trust boundary.</desc>
<defs>
<style type="text/css"><![CDATA[
  .sans { font-family: Inter, Segoe UI, Helvetica, Arial, sans-serif; }
  .mono { font-family: JetBrains Mono, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace; }
]]></style>
